<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reading — StoryNest</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="image/fav.png">

<!-- =====================================================
     READER SCROLL FIX
     ===================================================== -->
<style>
    /* Allow normal scrolling on ALL devices */
    html {
        height: auto;
        min-height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
    }

    body {
        height: auto;
        min-height: 100vh;
        margin: 0;
        overflow-y: auto;
        overflow-x: hidden;
    }

    /* Prevent old reader CSS from locking the page */
    .reader-page {
        height: auto !important;
        min-height: 100vh;
        overflow-y: auto !important;
        overflow-x: hidden !important;
    }

    /* Main reader area must grow with the chapter */
    .reader-container {
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
    }

    .reader-page-content {
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
    }

    .story {
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
    }

    /* Chapter text should never create its own locked box */
    .story p {
        height: auto;
        overflow: visible;
    }

    /* Keep header at the top without locking the whole page */
    .reader-header {
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    /* Progress bar stays visible while scrolling */
    .reading-progress {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 2000;
    }

    /* Mobile */
    @media (max-width: 767px) {
        html,
        body {
            height: auto !important;
            min-height: 100%;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            -webkit-overflow-scrolling: touch;
        }

        .reader-page {
            height: auto !important;
            overflow-y: auto !important;
        }

        .reader-container {
            height: auto !important;
            overflow: visible !important;
        }

        .reader-page-content {
            height: auto !important;
            overflow: visible !important;
        }

        .story {
            height: auto !important;
            max-height: none !important;
            overflow: visible !important;
        }
    }
</style>

</head>

<body>

<!-- =====================================================
     READER HEADER
===================================================== -->

<header class="reader-header">

    <div class="reader-header-left">

        <a href="index.html"
           class="reader-back"
           title="Home">
            ←
        </a>

        <div class="reader-header-info">
            <strong id="readerNovelTitle">
                Loading...
            </strong>

            <span id="chapterHeader">
                Chapter 1
            </span>
        </div>

    </div>

    <div class="reader-actions">

        <button
            id="readerMenuBtn"
            class="reader-menu-btn"
            onclick="toggleReaderMenu(event)"
            title="Menu">
            ⋮
        </button>

        <div
            class="reader-dropdown"
            id="readerDropdown">

            <a href="#"
               onclick="goToNovelDetails(); return false;">
                📚 Novel Details
            </a>

            <a href="#"
               onclick="goHome(); return false;">
                🏠 Home
            </a>

            <a href="#"
               onclick="toggleFontSize(); return false;"
               id="fontSizeBtn">
                🔤 18px
            </a>

            <a href="#"
               onclick="toggleTheme(); return false;"
               id="themeBtn">
                🌙 Dark Mode
            </a>

        </div>

    </div>

</header>


<!-- =====================================================
     READING PROGRESS BAR
===================================================== -->

<div
    class="reading-progress"
    id="readingProgress">
</div>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<main class="reader-container">

    <div
        class="reader-page-content"
        id="readerPageContent">

        <h1 id="chapterTitle">
            Loading...
        </h1>

        <div
            class="story"
            id="storyContent">

            <p>
                Loading chapter...
            </p>

        </div>

    </div>

</main>


<!-- =====================================================
     AD SPACE
===================================================== -->

<div
    class="reader-ad-space"
    id="readerAdSpace">
</div>


<!-- =====================================================
     SCRIPTS
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/reader.js"></script>


<!-- =====================================================
     READER MENU & CONTROLS
===================================================== -->

<script>

    // =====================================================
    // MENU TOGGLE
    // =====================================================

    function toggleReaderMenu(event) {

        event.stopPropagation();

        const dropdown =
            document.getElementById('readerDropdown');

        if (dropdown) {
            dropdown.classList.toggle('active');
        }
    }


    // Close menu when clicking elsewhere

    document.addEventListener('click', function(e) {

        const dropdown =
            document.getElementById('readerDropdown');

        const menuBtn =
            document.getElementById('readerMenuBtn');

        if (
            dropdown &&
            menuBtn &&
            !dropdown.contains(e.target) &&
            e.target !== menuBtn
        ) {
            dropdown.classList.remove('active');
        }

    });


    // =====================================================
    // NAVIGATION
    // =====================================================

    function goToNovelDetails() {

        const params =
            new URLSearchParams(window.location.search);

        const id = params.get('id');

        if (id) {

            window.location.href =
                'novel.html?id=' + id;

        }

    }


    function goHome() {

        window.location.href =
            'index.html';

    }


    // =====================================================
    // FONT SIZE
    // =====================================================

    let currentFontSize =
        parseInt(
            localStorage.getItem('readerFontSize')
        ) || 18;


    function toggleFontSize() {

        const sizes =
            [16, 18, 20, 22, 24, 26];

        let index =
            sizes.indexOf(currentFontSize);

        if (
            index === -1 ||
            index === sizes.length - 1
        ) {

            currentFontSize =
                sizes[0];

        } else {

            currentFontSize =
                sizes[index + 1];

        }

        applyFontSize(currentFontSize);

        localStorage.setItem(
            'readerFontSize',
            currentFontSize
        );

        const btn =
            document.getElementById('fontSizeBtn');

        if (btn) {

            btn.textContent =
                '🔤 ' +
                currentFontSize +
                'px';

        }

    }


    function applyFontSize(size) {

        const content =
            document.querySelector(
                '.reader-page-content'
            );

        const story =
            document.querySelector(
                '.story'
            );

        const paragraphs =
            document.querySelectorAll(
                '.reader-page-content p, .story p'
            );


        if (content) {

            content.style.fontSize =
                size + 'px';

        }


        if (story) {

            story.style.fontSize =
                size + 'px';

        }


        paragraphs.forEach(function(p) {

            p.style.fontSize =
                size + 'px';

        });

    }


    // =====================================================
    // THEME
    // =====================================================

    let currentTheme =
        localStorage.getItem('readerTheme') ||
        'light';


    function toggleTheme() {

        const body =
            document.body;

        const btn =
            document.getElementById('themeBtn');


        if (currentTheme === 'light') {

            body.classList.add(
                'dark-theme'
            );

            currentTheme =
                'dark';


            if (btn) {

                btn.textContent =
                    '☀️ Light Mode';

            }

        } else {

            body.classList.remove(
                'dark-theme'
            );

            currentTheme =
                'light';


            if (btn) {

                btn.textContent =
                    '🌙 Dark Mode';

            }

        }


        localStorage.setItem(
            'readerTheme',
            currentTheme
        );

    }


    function applyTheme(theme) {

        const body =
            document.body;

        const btn =
            document.getElementById('themeBtn');


        if (theme === 'dark') {

            body.classList.add(
                'dark-theme'
            );


            if (btn) {

                btn.textContent =
                    '☀️ Light Mode';

            }

        } else {

            body.classList.remove(
                'dark-theme'
            );


            if (btn) {

                btn.textContent =
                    '🌙 Dark Mode';

            }

        }


        currentTheme =
            theme;

    }


    // =====================================================
    // RESTORE PREFERENCES
    // =====================================================

    document.addEventListener(
        'DOMContentLoaded',
        function() {

            // Restore font size

            const savedSize =
                localStorage.getItem(
                    'readerFontSize'
                );


            if (savedSize) {

                currentFontSize =
                    parseInt(savedSize);

                applyFontSize(
                    currentFontSize
                );


                const btn =
                    document.getElementById(
                        'fontSizeBtn'
                    );


                if (btn) {

                    btn.textContent =
                        '🔤 ' +
                        currentFontSize +
                        'px';

                }

            }


            // Restore theme

            const savedTheme =
                localStorage.getItem(
                    'readerTheme'
                );


            if (savedTheme) {

                applyTheme(
                    savedTheme
                );

            }


            // Hide chapter progress counter on mobile

            const progressEl =
                document.querySelector(
                    '.chapter-progress'
                );


            if (
                progressEl &&
                window.innerWidth < 768
            ) {

                progressEl.style.display =
                    'none';

            }

        }
    );


    // =====================================================
    // HANDLE RESIZE
    // =====================================================

    window.addEventListener(
        'resize',
        function() {

            const progressEl =
                document.querySelector(
                    '.chapter-progress'
                );


            if (progressEl) {

                if (
                    window.innerWidth < 768
                ) {

                    progressEl.style.display =
                        'none';

                } else {

                    progressEl.style.display =
                        'block';

                }

            }

        }
    );


    // =====================================================
    // FORCE NORMAL PAGE SCROLL
    // =====================================================

    window.addEventListener(
        'load',
        function() {

            document.documentElement.style.height =
                'auto';

            document.body.style.height =
                'auto';

            document.documentElement.style.overflowY =
                'auto';

            document.body.style.overflowY =
                'auto';

            document.body.style.overflowX =
                'hidden';

        }
    );


    console.log(
        '📖 StoryNest reader loaded with normal scrolling.'
    );

</script>

</body>

</html>
